# One origin for everything: the React files, and the API behind /api.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/models -> http://api:3000/models. `api` is the name of the service
  # in compose.yaml: Docker's internal DNS resolves it. The trailing slash of
  # proxy_pass is what removes the /api prefix.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router owns the URLs: /models/bert is not a file on disk, so any
  # unknown path gets index.html and the router takes over in the browser.
  location / {
    try_files $uri /index.html;
  }
}
